# Authenticated loopback deployment. Keep SQLite on a local filesystem.
# Supported image architecture: linux/amd64 (ARM requires Docker emulation).
name: seorap

x-build: &build
  context: .
  target: runtime
x-common: &common
  image: seorap:local
  platform: linux/amd64
  user: "10001:10001"
  env_file:
    - .env
  volumes:
    - seorap-data:/data
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=268435456,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  stop_grace_period: 40s
  cpus: "1.50"
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  volume-init:
    build: *build
    image: seorap:local
    platform: linux/amd64
    user: "0:0"
    restart: "no"
    entrypoint: ["sh", "/opt/seorap/init-volume.sh"]
    volumes:
      - seorap-data:/data
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN

  app:
    <<: *common
    depends_on:
      volume-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"
    mem_limit: 1536m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    <<: *common
    depends_on:
      volume-init:
        condition: service_completed_successfully
    command: ["python", "-m", "app.worker"]
    mem_limit: 2048m
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sqlite3,datetime; c=sqlite3.connect('/data/state/app.db'); r=c.execute('select beat_at from worker_heartbeat where id=1').fetchone(); assert r and 0 <= (datetime.datetime.now(datetime.timezone.utc)-datetime.datetime.fromisoformat(r[0])).total_seconds()<30"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 25s

volumes:
  seorap-data:
